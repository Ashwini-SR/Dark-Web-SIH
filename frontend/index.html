<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEIL·ATLAS — Investigator Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root{
    --bg: #0B0E14;
    --panel: #12161F;
    --panel-border: #232938;
    --ink: #E6E9F0;
    --ink-dim: #8B93A7;
    --teal: #5EEAD4;
    --amber: #F0B429;
    --red: #F26D6D;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: 1px; color: var(--teal); }
  .brand .sub { font-size: 12px; color: var(--ink-dim); font-family: var(--mono); }
  .status { font-size: 11px; font-family: var(--mono); color: var(--ink-dim); display:flex; gap:16px; align-items:center;}
  .dot { width:7px; height:7px; border-radius:50%; background: var(--teal); display:inline-block; margin-right:6px; box-shadow: 0 0 6px var(--teal); }

  .layout { display: grid; grid-template-columns: 260px 1fr 380px; height: calc(100vh - 53px); }

  .sidebar {
    border-right: 1px solid var(--panel-border);
    padding: 18px;
    overflow-y: auto;
  }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-dim); margin: 0 0 12px; }
  .persona-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .persona-card .id { font-family: var(--mono); color: var(--teal); font-weight: 500; }
  .persona-card .meta { color: var(--ink-dim); font-size: 11px; margin-top: 3px; }

  .control-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--panel-border); }
  .control-row label { font-size: 11px; color: var(--ink-dim); display:block; margin-bottom:6px; }
  input[type=range] { width: 100%; accent-color: var(--teal); }
  .threshold-val { font-family: var(--mono); color: var(--amber); font-size: 13px; margin-top:4px; }

  #graph { position: relative; background: radial-gradient(ellipse at center, #10141d 0%, #0B0E14 70%); }

  .evidence-panel {
    border-left: 1px solid var(--panel-border);
    padding: 20px;
    overflow-y: auto;
  }
  .evidence-panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-dim); margin: 0 0 4px; }
  .empty-state { color: var(--ink-dim); font-size: 13px; margin-top: 40px; text-align:center; line-height: 1.6; }
  .empty-state .icon { font-size: 28px; display:block; margin-bottom: 10px; opacity: 0.4;}

  .pair-title { font-family: var(--mono); font-size: 15px; margin: 10px 0 4px; }
  .pair-title .vs { color: var(--ink-dim); font-weight: 400; margin: 0 6px;}

  .confidence-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    margin: 10px 0 18px;
  }
  .conf-high { background: rgba(94,234,212,0.15); color: var(--teal); border: 1px solid var(--teal); }
  .conf-mod  { background: rgba(240,180,41,0.15); color: var(--amber); border: 1px solid var(--amber); }
  .conf-low  { background: rgba(242,109,109,0.15); color: var(--red); border: 1px solid var(--red); }

  .evidence-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--teal);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .evidence-item .src { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--teal); }
  .evidence-item .tag { font-size: 9px; color: var(--ink-dim); border: 1px solid var(--panel-border); border-radius: 3px; padding: 1px 6px; margin-left: 8px; letter-spacing: 0.5px;}
  .bar-track { height: 5px; background: #1c2231; border-radius: 3px; margin: 8px 0; overflow:hidden; }
  .bar-fill { height: 100%; background: var(--teal); }
  .reasons { list-style: none; padding: 0; margin: 8px 0 0; font-size: 12px; color: var(--ink-dim); }
  .reasons li { padding-left: 14px; position: relative; margin-bottom: 4px; }
  .reasons li::before { content: "›"; position: absolute; left: 0; color: var(--teal); }

  .disclaimer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--ink-dim);
    border-top: 1px solid var(--panel-border);
    padding-top: 14px;
    line-height: 1.5;
  }

  button.run-btn {
    background: var(--teal);
    color: #0B0E14;
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
  }
  button.run-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">VEIL·ATLAS</span>
    <span class="sub">// mapping the shadows, one evidence-backed edge at a time</span>
  </div>
  <div class="status"><span><span class="dot"></span>API connected</span><span id="edge-count">0 hypothesis links</span></div>
</div>

<div class="layout">

  <div class="sidebar">
    <h3>Personas ingested</h3>
    <div id="persona-list"></div>

    <div class="control-row">
      <label>Confidence threshold</label>
      <input type="range" id="threshold" min="0" max="1" step="0.05" value="0.5">
      <div class="threshold-val" id="threshold-val">0.50</div>
      <button class="run-btn" id="run-btn">RUN CORRELATION ENGINE</button>
    </div>
  </div>

  <div id="graph"></div>

  <div class="evidence-panel" id="evidence-panel">
    <h3>Evidence Derivation</h3>
    <div class="empty-state" id="empty-state">
      <span class="icon">◈</span>
      Click a link between two personas in the graph to inspect the full evidence chain behind its confidence score.
    </div>
    <div id="evidence-content" style="display:none;"></div>
  </div>

</div>

<script>
const API = "http://localhost:8000";
let network;

async function loadPersonas() {
  const res = await fetch(`${API}/personas`);
  const personas = await res.json();
  const list = document.getElementById("persona-list");
  list.innerHTML = personas.map(p => `
    <div class="persona-card">
      <div class="id">${p.display_name}</div>
      <div class="meta">${p.forum} · ${p.post_count} posts</div>
    </div>
  `).join("");
}

function confidenceClass(score) {
  if (score >= 0.8) return "conf-high";
  if (score >= 0.55) return "conf-mod";
  return "conf-low";
}

async function loadGraph(threshold) {
  const res = await fetch(`${API}/graph?threshold=${threshold}`);
  const data = await res.json();

  document.getElementById("edge-count").textContent = `${data.edges.length} hypothesis link${data.edges.length !== 1 ? 's' : ''}`;

  const nodes = new vis.DataSet(data.nodes.map(n => ({
    id: n.id,
    label: n.label,
    shape: "dot",
    size: 22,
    font: { color: "#E6E9F0", face: "JetBrains Mono", size: 13 },
    color: { background: "#5EEAD4", border: "#0B0E14" }
  })));

  const edges = new vis.DataSet(data.edges.map((e, i) => ({
    id: i,
    from: e.persona_a,
    to: e.persona_b,
    width: 1 + e.confidence * 6,
    color: {
      color: e.confidence >= 0.8 ? "#5EEAD4" : e.confidence >= 0.55 ? "#F0B429" : "#F26D6D",
      opacity: 0.8
    },
    label: `${Math.round(e.confidence * 100)}%`,
    font: { color: "#8B93A7", size: 10, strokeWidth: 0, background: "#0B0E14" },
    _payload: e
  })));

  const container = document.getElementById("graph");
  network = new vis.Network(container, { nodes, edges }, {
    physics: { stabilization: true, barnesHut: { gravitationalConstant: -4000, springLength: 180 } },
    interaction: { hover: true }
  });

  network.on("click", (params) => {
    if (params.edges.length > 0) {
      const edge = edges.get(params.edges[0]);
      showEvidence(edge._payload);
    }
  });
}

function showEvidence(pair) {
  document.getElementById("empty-state").style.display = "none";
  const content = document.getElementById("evidence-content");
  content.style.display = "block";

  const badgeClass = confidenceClass(pair.confidence);

  content.innerHTML = `
    <div class="pair-title">${pair.persona_a}<span class="vs">↔</span>${pair.persona_b}</div>
    <span class="confidence-badge ${badgeClass}">${Math.round(pair.confidence*100)}% — ${labelFor(pair.confidence)}</span>

    ${pair.derivation.map(d => `
      <div class="evidence-item">
        <span class="src">${d.source}</span><span class="tag">${d.type}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${d.raw_score*100}%"></div></div>
        <div style="font-family:var(--mono); font-size:11px; color:var(--ink-dim);">
          raw score ${d.raw_score} · weight ${d.weight} · contributes ${d.contribution}
        </div>
        <ul class="reasons">${d.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
      </div>
    `).join("")}

    <div class="disclaimer">
      This is a probabilistic HYPOTHESIS, not a confirmed identity link. It is derived entirely from
      the weighted evidence shown above. No claim of real-world identity is made or implied.
    </div>
  `;
}

function labelFor(score) {
  if (score >= 0.8) return "HIGH CONFIDENCE";
  if (score >= 0.55) return "MODERATE CONFIDENCE";
  if (score >= 0.3) return "LOW CONFIDENCE";
  return "INSUFFICIENT EVIDENCE";
}

document.getElementById("threshold").addEventListener("input", (e) => {
  document.getElementById("threshold-val").textContent = parseFloat(e.target.value).toFixed(2);
});

document.getElementById("run-btn").addEventListener("click", () => {
  const t = parseFloat(document.getElementById("threshold").value);
  loadGraph(t);
});

loadPersonas();
loadGraph(0.5);
</script>

</body>
</html>
